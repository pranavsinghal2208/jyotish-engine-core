[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotish-engine-core"
version = "0.1.0"
description = "A high-precision Vedic Astrology (Jyotish) engine"
authors = [
    {name = "Pranav Singhal"}
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pyswisseph>=2.00.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "httpx>=0.24.0",
]

[tool.black]
line-length = 88
target-version = ['py38']
skip-string-normalization = true

[tool.flake8]
max-line-length = 88
extend-ignore = [
    "E203",  # Whitespace before ':' ignored by black
    "W503",  # Line break before binary operator ignored by black
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".env",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
files = ["src/"]