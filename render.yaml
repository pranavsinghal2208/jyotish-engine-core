services:
  - type: web
    name: cosmic-os
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-os-db
          property: connectionString

databases:
  - name: cosmic-os-db
    plan: free
